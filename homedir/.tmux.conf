set -g default-terminal "screen-256color"
set -g default-command "reattach-to-user-namespace -l zsh"
set-option -g mouse on

# Copy mode
setw -g mode-keys vi
set -g history-limit 500000
set -g window-status-current-style bg=red

# Prefix: Ctrl-w
unbind C-b
set -g prefix C-w
bind C-w send-prefix

# Vi-style copy mode
unbind [
bind v copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel \;\
                             run-shell "tmux save-buffer - | reattach-to-user-namespace pbcopy"

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key H if-shell "$is_vim" "send-keys C-w H"
bind-key J if-shell "$is_vim" "send-keys C-w J"
bind-key K if-shell "$is_vim" "send-keys C-w K"
bind-key L if-shell "$is_vim" "send-keys C-w L"
bind-key '\' if-shell "$is_vim" "send-keys C-w \\"  "split-window -h"
bind-key - if-shell "$is_vim" "send-keys C-w -"  "split-window"

# Pane resizing
bind-key -n M-s resize-pane -D 5
bind-key -n M-w resize-pane -U 5
bind-key -n M-a resize-pane -L 5
bind-key -n M-d resize-pane -R 5

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vi navigation in copy mode
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi l send-keys -X cursor-right
